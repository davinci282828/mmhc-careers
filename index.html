  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

0-2C7F,U+A720-A7FF}\n@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(\"6320bd97-c3fd-4588-aa6c-8c0c636714d3\") format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}\n<\u002Fstyle>\n<style>/* MMHC — color tokens. Base palette (from \"MMHC Page Template Design Rules\") + semantic aliases (from the approved Service Page Template). */\n:root{\n/* Base palette — the only greens allowed; never invent near-duplicates */\n--mmhc-green-900:#1E4129; /* dark green: headings, strong surfaces, important actions */\n--mmhc-green-700:#486558; /* muted green: eyebrows, secondary labels */\n--mmhc-green-500:#7DC242; /* green accent border (numbered/answer cards, answer block) */\n--mmhc-green-300:#A1E681; /* bright light green: primary CTA fill, selected accents, hero shapes */\n--mmhc-green-200:#DCE8CC; /* soft border green: card borders, table dividers, on-dark body text */\n--mmhc-green-50:#EFFAF3;  /* mint cream: alternating section surface, input fill */\n--mmhc-white:#FFFFFF;\n--mmhc-ink:#26302A;       /* muted black: body text, prominent statistics */\n/* Supporting colors that appear in the approved template */\n--mmhc-green-400-muted:#8FAF95; /* footer copyright line on dark green */\n--mmhc-star:#F4B400;            /* Google review stars — reviews only */\n--mmhc-required:#C0392B;        /* required-field asterisk — forms only */\n--mmhc-template-mark:#FFF3B0;   /* yellow highlight for [CARRIER] fill-in tokens — authoring only, never ships */\n/* Translucent overlays used on strong surfaces */\n--mmhc-overlay-white-4:rgba(255,255,255,0.04);   /* decorative leaf shapes on dark green */\n--mmhc-overlay-white-14:rgba(255,255,255,0.14);  /* footer divider */\n--mmhc-overlay-white-45:rgba(255,255,255,0.45);  /* carousel arrows on bright green */\n--mmhc-overlay-white-70:rgba(255,255,255,0.7);   /* carousel arrows hover */\n\n/* Semantic — text */\n--color-heading:var(--mmhc-green-900);\n--color-body:var(--mmhc-ink);\n--color-eyebrow:var(--mmhc-green-700);\n--color-label:var(--mmhc-green-700);\n--color-stat:var(--mmhc-ink);\n--color-link:var(--mmhc-green-900);\n--color-link-hover:var(--mmhc-green-700);\n--color-on-dark-heading:var(--mmhc-white);\n--color-on-dark-body:var(--mmhc-green-50);\n--color-on-dark-muted:var(--mmhc-green-200);\n--color-on-dark-eyebrow:var(--mmhc-green-300);\n--color-on-dark-link:var(--mmhc-green-300);\n--color-on-accent-eyebrow:var(--mmhc-green-900);\n--color-on-accent-heading:var(--mmhc-ink);\n\n/* Semantic — surfaces */\n--surface-page:var(--mmhc-white);\n--surface-mint:var(--mmhc-green-50);\n--surface-strong:var(--mmhc-green-900);\n--surface-accent:var(--mmhc-green-300);\n--surface-card:var(--mmhc-white);\n--surface-card-mint:var(--mmhc-green-50);\n--surface-input:var(--mmhc-green-50);\n--surface-table-head:var(--mmhc-green-900);\n--surface-table-stripe:var(--mmhc-green-50);\n\n/* Semantic — borders */\n--border-default:var(--mmhc-green-200);\n--border-accent:var(--mmhc-green-500);\n--border-strong:var(--mmhc-green-900);\n--border-focus:var(--mmhc-green-900);\n\n/* Semantic — actions */\n--action-primary-bg:var(--mmhc-green-300);\n--action-primary-border:var(--mmhc-green-300);\n--action-primary-fg:var(--mmhc-green-900);\n--action-primary-hover-bg:var(--mmhc-green-900);\n--action-primary-hover-fg:var(--mmhc-white);\n--action-call-bg:var(--mmhc-white);\n--action-call-border:var(--mmhc-green-900);\n--action-call-fg:var(--mmhc-green-900);\n--action-call-hover-bg:var(--mmhc-green-50);\n--action-submit-bg:var(--mmhc-green-900);\n--action-submit-fg:var(--mmhc-green-300);\n--action-submit-hover-bg:var(--mmhc-green-300);\n--action-submit-hover-fg:var(--mmhc-green-900);\n--action-active-opacity:0.92; /* @kind other */\n--chip-selected-bg:var(--mmhc-green-900);\n--chip-selected-fg:var(--mmhc-white);\n--badge-number-bg:var(--mmhc-green-300);\n--badge-number-fg:var(--mmhc-green-900);\n--badge-number-strong-bg:var(--mmhc-green-900);\n--badge-number-strong-fg:var(--mmhc-white);\n}\n<\u002Fstyle>\n<style>/* MMHC — typography tokens. Two families: Merriweather (serif) for headings and large figures — matches the live homepage; Archivo for body, labels, buttons, card titles. Root 16px; sizes in rem mirror the site builder's em scale. Mobile values apply through 766px; desktop from 767px. */\n:root{\n--font-heading:'Merriweather',serif;   /* H1/H2/H3 at heading scale + all large figures (stats, survey, prices, callout numbers) */\n--font-display:'Merriweather',serif;   /* alias of --font-heading for figures */\n--font-body:'Archivo',sans-serif;      /* body, eyebrows, labels, buttons, body-size card titles */\n--weight-stat:700;                     /* figures match the homepage's Merriweather Bold */\n--font-size-root:16px;\n/* Scale — desktop */\n--text-h1:2.8rem;\n--text-h2:2.6rem;\n--text-h3:2.4rem;      /* genuine subsections (data-h=\"sub\") */\n--text-h3-card:0.9rem; /* card titles share body size, bold */\n--text-body:0.9rem;\n--text-lead:1rem;      /* hero answer block, dark callout support line */\n--text-small:0.8rem;   /* eyebrow, supporting labels, footer, references, therapist bios */\n--text-eyebrow:0.8rem;\n--text-stat:2.6rem;\n--text-stat-label:0.8rem;\n--text-price:1.2rem;   /* self-pay rate figures, member-services phone */\n--text-chip:0.75rem;\n--text-button:0.9rem;\n--text-input:0.9rem;  /* form fields; 1rem on mobile */\n/* Weights (variable font, real weights) */\n--weight-regular:400;\n--weight-medium:500;\n--weight-semibold:600; /* form labels, condition list, review names */\n--weight-bold:700;     /* headings, buttons, eyebrows, card titles */\n--weight-extrabold:800;/* footer eyebrows, phone links (Archivo) */\n/* Line heights */\n--leading-body:1.6;\n--leading-h1:1.1;\n--leading-h2:1.15;\n--leading-h2-relaxed:1.2;\n--leading-stat:1.15;\n--leading-button:1.3;\n--leading-chip:1.25;\n--leading-tight:1;\n/* Tracking */\n--tracking-h1:-0.01em;\n--tracking-eyebrow:0.12em;       /* default eyebrow */\n--tracking-eyebrow-wide:0.14em;  /* used on some section eyebrows */\n--tracking-eyebrow-widest:0.16em;/* testimonials eyebrow */\n--tracking-eyebrow-compact:0.08em;/* footer / member-services label */\n--tracking-caps-list:0.02em;     /* uppercase condition list */\n--tracking-submit:0.04em;        /* uppercase submit button */\n--tracking-stars:2px;\n}\n@media (max-width:766px){:root{\n--text-h1:1.8rem;\n--text-h2:1.6rem;\n--text-h3:1.8rem;\n--text-body:1rem;\n--text-small:0.875rem;\n--text-input:1rem;\n--text-eyebrow:0.7rem;\n--text-stat:1.6rem;\n--text-stat-label:0.7rem;\n--text-button:1rem;\n--text-h3-card:1rem;\n}}\n<\u002Fstyle>\n<style>/* MMHC — spacing, layout, radii, borders, motion. Values copied from the approved Service Page Template; do not snap to a 4/8 grid. */\n:root{\n/* Section rhythm */\n--section-pad-y:3rem;   /* desktop; 2rem mobile */\n--section-pad-x:24px;   /* desktop; 20px mobile */\n--section-title-gap:1.5rem; /* title group → first content block */\n/* Containers */\n--container-wide:1180px;    /* hero, two-column sections, grids, footer */\n--container-reading:920px;  /* prose-led sections: cost, why MMHC, FAQ, references */\n--container-reviews:1040px; /* review card grid */\n--container-callout:920px;\n/* Gaps — the normal grouped-element gap is 1em; no arbitrary micro-gaps (.3/.35/.4/.45/.75em) */\n--gap:1rem;\n--gap-sm:0.5rem;   /* form field internals, chips, list rows */\n--gap-lg:1.5rem;\n--gap-xl:2rem;\n--gap-col:3rem;    /* two-column grid column gap */\n/* Cards */\n--card-pad:15px;\n--card-radius:15px;\n--card-border:1px solid var(--border-default);\n--card-accent-border-width:1px 1px 1px 3px; /* @kind spacing */ /* numbered / answer cards: left 3px accent */\n--callout-pad:2rem;\n/* Radii */\n--radius-card:15px;\n--radius-pill:50px;   /* buttons, chips */\n--radius-input:6px;\n--radius-circle:50%;\n--radius-mark:3px;    /* inline highlight */\n--radius-leaf:0 100% 0 100%; /* decorative leaf shapes on strong surfaces */\n/* Borders */\n--border-width:1px;\n--border-width-accent:3px;\n/* Buttons */\n--button-width:100%;\n--button-max-width:350px;\n--button-pad:0.9em 1.2em;\n--button-radius:50px;\n--button-shadow:none;\n/* Circular number badges / icons */\n--badge-size:28px;      /* answer cards, verify list, questions list */\n--badge-size-step:34px; /* how-it-works steps */\n--badge-size-list:36px; /* form-side proof list */\n--badge-size-icon:40px; /* crisis bar icon, carousel arrows */\n--badge-size-check:56px;/* form success check */\n--faq-indicator-size:26px;\n/* Form */\n--input-pad:0.7em 0.8em;\n--chip-min-height:44px;\n--chip-pad:0.6em;\n/* Images */\n--image-radius:15px;\n--hero-image-ratio:1/0.95; /* @kind other */\n--band-image-ratio:6/5; /* @kind other */\n--portrait-size:220px;\n--logo-slot:220px 64px; /* @kind spacing */\n/* Focus */\n--focus-ring:2px solid var(--border-focus);\n--focus-offset:3px;\n/* Motion — none by rule: no jumping, scaling or decorative animation; hover = color swap only */\n--motion-duration:0s; /* @kind other */\n--motion-hover:none; /* @kind other */\n/* Breakpoints (reference only — custom properties cannot drive media queries) */\n--bp-mobile-max:766px;\n--bp-desktop-min:767px;\n--bp-tablet-max:860px;\n--shadow-none:none;\n}\n@media (max-width:766px){:root{\n--section-pad-y:2rem;\n--section-pad-x:20px;\n}}\n<\u002Fstyle>\n<style>/* MMHC — global element baseline (from the approved template's helmet CSS). Kept tiny: everything else is component-level. */\nhtml{font-size:var(--font-size-root)}\nbody{margin:0;font-family:var(--font-body);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-body);background:var(--surface-page);-webkit-font-smoothing:antialiased}\na{color:var(--color-link)}\na:hover{color:var(--color-link-hover)}\na:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:var(--focus-ring);outline-offset:var(--focus-offset)}\n[data-btn]:active{transform:none;opacity:var(--action-active-opacity)}\nh1,h2,h3{font-family:var(--font-heading);color:var(--color-heading);margin:0;text-wrap:pretty}\nh3[data-h=\"card\"]{font-family:var(--font-body);font-size:var(--text-h3-card);line-height:var(--leading-body)}\nh1{font-size:var(--text-h1);font-weight:var(--weight-bold);line-height:var(--leading-h1);letter-spacing:var(--tracking-h1)}\nh2{font-size:var(--text-h2);font-weight:var(--weight-bold);line-height:var(--leading-h2)}\nh3{font-size:var(--text-h3);font-weight:var(--weight-bold);line-height:var(--leading-h2)}\nimg{max-width:100%}\n<\u002Fstyle>\n<style>/* MMHC — responsive behaviour hooks (from the approved template). Components emit data-rsp=\"…\"; mobile values apply through 766px, desktop from 767px; 3-col grids drop to 2 through 860px. */\n@media (max-width:860px){\n[data-rsp=\"types\"]{grid-template-columns:1fr 1fr !important}\n[data-rsp=\"types\"] > *{grid-column:auto !important;grid-row:auto !important}\n[data-rsp=\"types\"] > [data-wide]{grid-column:1 / -1 !important}\n[data-rsp=\"grid3\"]{grid-template-columns:1fr 1fr !important}\n}\n@media (max-width:766px){\nsection[data-flush=\"top\"]{padding-top:0 !important}\n[data-rsp=\"grid\"],[data-rsp=\"grid3\"],[data-rsp=\"stats\"],[data-rsp=\"reviews\"]{grid-template-columns:1fr !important}\n[data-rsp=\"form-grid\"]{grid-template-columns:1fr !important;grid-template-areas:'title' 'form' 'support' !important;grid-template-rows:auto auto auto !important}\n[data-rsp=\"chips\"]{grid-template-columns:repeat(2,minmax(0,1fr)) !important}\n[data-rsp=\"stat-mid\"]{border-left:none !important;border-right:none !important;border-top:1px solid var(--border-strong);border-bottom:1px solid var(--border-strong)}\n[data-rsp=\"hero-deco\"]{display:none !important}\n[data-rsp=\"guide-cols\"]{columns:1 !important}\n[data-rsp=\"hide-mobile\"]{display:none !important}\n[data-rsp=\"show-mobile-flex\"]{display:flex !important}\n[data-rsp=\"reviews\"] > *:nth-child(n+2){display:none !important}\n[data-rsp=\"condlist\"]{gap:0.5rem !important}\n[data-rsp=\"types\"]{grid-template-columns:1fr !important}\n[data-rsp=\"rail\"]{grid-template-columns:1fr 1fr !important;row-gap:1.5rem !important}\n[data-rsp=\"rail-line\"]{display:none !important}\n[data-rsp=\"survey-grid\"]{grid-template-columns:1fr 1fr !important}\n[data-rsp=\"survey-first\"]{display:none !important}\n[data-rsp=\"survey-mid\"]{border-left:none !important}\n[data-rsp=\"survey-head\"]{flex-direction:column;align-items:flex-start;gap:2px}\n[data-rsp=\"survey-num\"]{font-size:2.2rem !important}\n[data-rsp=\"show-mobile-block\"]{display:block !important}\n}\n<\u002Fstyle>\n<style>/* MMHC — motion. Calm, one-time, meaningful. Attribute hooks, so no class names; everything is off under prefers-reduced-motion.\n   Add to styles.css: @import url('tokens/motion.css');  Pair with motion.js (sets html[data-anim] and reveals on scroll). */\n:root{\n--motion-fast:.18s; /* @kind other */          /* colour swaps: buttons, chips, quiz options */\n--motion-base:.8s; /* @kind other */           /* scroll reveals, entrance */\n--motion-slow:1.4s; /* @kind other */          /* count-ups, bars, rails */\n--motion-ambient:9s; /* @kind other */         /* breathing circles; leaves sway at 16s */\n--ease-out:cubic-bezier(.2,.7,.2,1); /* @kind other */\n--ease-draw:cubic-bezier(.45,0,.2,1); /* @kind other */\n--stagger:90ms; /* @kind other */              /* between siblings in a group; cap at ~6 items */\n}\n[data-btn]:active { transform: none; opacity: 0.92; }\n@keyframes mmhcUp { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }\n@keyframes mmhcPop { from { opacity: 0; transform: translateY(28px) scale(0.97); } to { opacity: 1; transform: none; } }\n@keyframes mmhcBreathe { from { scale: 1; } to { scale: 1.045; } }\n@keyframes mmhcSway { from { translate: 0 0; } to { translate: 16px -14px; } }\n@keyframes mmhcFaq { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }\n@keyframes mmhcPulse { 0%, 100% { scale: 1; } 50% { scale: 1.03; } }\n@keyframes mmhcPing { from { scale: 1; opacity: 0.55; } to { scale: 3.2; opacity: 0; } }\n[data-enter=\"up\"] { animation: mmhcUp .8s cubic-bezier(.2,.7,.2,1) both; }\n[data-enter=\"pop\"] { animation: mmhcPop 1s cubic-bezier(.2,.7,.2,1) both; }\n[data-breathe] { animation: mmhcBreathe 9s ease-in-out infinite alternate; }\n[data-sway] { animation: mmhcSway 16s ease-in-out infinite alternate; }\n[data-faq-a] { animation: mmhcFaq .32s cubic-bezier(.2,.7,.2,1) both; }\n[data-quiz-cta][data-picked=\"yes\"] { animation: mmhcPulse 1.3s ease-in-out 3; }\n[data-ping] { transform-box: fill-box; transform-origin: center; animation: mmhcPing 2.4s ease-out infinite; }\n[data-btn], [data-quiz-opt], label[data-chip] { transition: background-color .18s ease, border-color .18s ease, color .18s ease; }\n[data-quiz-opt]:hover { border-color: #7DC242 !important; }\n[data-quiz-opt][aria-pressed=\"true\"] { background: #EFFAF3 !important; border-color: #A1E681 !important; }\n[data-quiz-opt][aria-pressed=\"true\"] [data-quiz-badge] { background: #A1E681 !important; }\n[data-reveal], [data-group=\"title\"] { transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1); }\n[data-lift] { transition: opacity .8s cubic-bezier(.2,.7,.2,1), transform .8s cubic-bezier(.2,.7,.2,1), translate .25s ease, border-color .25s ease; }\n[data-lift]:hover { translate: 0 -4px; border-color: #1E4129 !important; }\nhtml[data-anim] [data-reveal]:not([data-in]), html[data-anim] [data-group=\"title\"]:not([data-in]) { opacity: 0; transform: translateY(20px); }\n[data-mark] { transition: background-color .7s ease, border-color .7s ease, background-size 1s cubic-bezier(.2,.7,.2,1), color .7s ease, opacity .7s ease; }\n[data-node], [data-bar] { transition: family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(\"186d657f-d60a-42cd-b7fe-29d8384c5133\") format('woff2');unicode-range:U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB}\n@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(\"a762f8ea-c979-4000-a1ef-2a0c02dc981e\") format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}\n@font-face{font-family:'Archivo';font-style:normal;font-weight:100 900;font-stretch:100%;font-display:swap;src:url(\"6320bd97-c3fd-4588-aa6c-8c0c636714d3\") format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}\n\n/* MMHC — color tokens. Base palette (from \"MMHC Page Template Design Rules\") + semantic aliases (from the approved Service Page Template). */\n:root{\n/* Base palette — the only greens allowed; never invent near-duplicates */\n--mmhc-green-900:#1E4129; /* dark green: headings, strong surfaces, important actions */\n--mmhc-green-700:#486558; /* muted green: eyebrows, secondary labels */\n--mmhc-green-500:#7DC242; /* green accent border (numbered/answer cards, answer block) */\n--mmhc-green-300:#A1E681; /* bright light green: primary CTA fill, selected accents, hero shapes */\n--mmhc-green-200:#DCE8CC; /* soft border green: card borders, table dividers, on-dark body text */\n--mmhc-green-50:#EFFAF3;  /* mint cream: alternating section surface, input fill */\n--mmhc-white:#FFFFFF;\n--mmhc-ink:#26302A;       /* muted black: body text, prominent statistics */\n/* Supporting colors that appear in the approved template */\n--mmhc-green-400-muted:#8FAF95; /* footer ary-fg:var(--mmhc-green-900);\n--action-primary-hover-bg:var(--mmhc-green-900);\n--action-primary-hover-fg:var(--mmhc-white);\n--action-call-bg:var(--mmhc-white);\n--action-call-border:var(--mmhc-green-900);\n--action-call-fg:var(--mmhc-green-900);\n--action-call-hover-bg:var(--mmhc-green-50);\n--action-submit-bg:var(--mmhc-green-900);\n--action-submit-fg:var(--mmhc-green-300);\n--action-submit-hover-bg:var(--mmhc-green-300);\n--action-submit-hover-fg:var(--mmhc-green-900);\n--action-active-opacity:0.92; /* @kind other */\n--chip-selected-bg:var(--mmhc-green-900);\n--chip-selected-fg:var(--mmhc-white);\n--badge-number-bg:var(--mmhc-green-300);\n--badge-number-fg:var(--mmhc-green-900);\n--badge-number-strong-bg:var(--mmhc-green-900);\n--badge-number-strong-fg:var(--mmhc-white);\n}\n\n/* MMHC — typography tokens. Two families: Merriweather (serif) for headings and large figures — matches the live homepage; Archivo for body, labels, buttons, card titles. Root 16px; sizes in rem mirror the site builder's em scale. Mobile values apply through 766px; desktop from 767px. */\n:root{\n--font-heading:'Merriweather',serif;   /* H1/H2/H3 at heading scale + all large figures (stats, survey, prices, callout numbers) */\n--font-display:'Merriweather',serif;   /* alias of --font-heading for figures */\n--font-body:'Archivo',sans-serif;      /* body, eyebrows, labels, buttons, body-size card titles */\n--weight-stat:700;                     /* figures match the homepage's Merriweather Bold */\n--font-size-root:16px;\n/* Scale — desktop */\n--text-h1:2.8rem;\n--text-h2:2.6rem;\n--text-h3:2.4rem;      /* genuine subsections (data-h=\"sub\") */\n--text-h3-card:0.9rem; /* card titles share body size, bold */\n--text-body:0.9rem;\n--text-lead:1rem;      /* hero answer block, dark callout support line */\n--text-small:0.8rem;   /* eyebrow, supporting labels, footer, references, therapist bios */\n--text-eyebrow:0.8rem;\n--text-stat:2.6rem;\n--text-stat-label:0.8rem;\n--text-price:1.2rem; otion: reduce){[data-careers-anim]{animation:none !important;stroke-dashoffset:0 !important;opacity:1 !important;scale:1 !important}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"background:var(--surface-page);overflow-x:hidden\">\n\n  <header style=\"padding:0.75rem 24px;background:var(--surface-page);border-bottom:1px solid var(--border-default)\">\n    <div style=\"max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1em;flex-wrap:wrap\">\n      <x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Logo\" variant=\"full\" height=\"{{ 48 }}\" assets-base=\"./assets/logo/\" href=\"https://manhattanmentalhealthcounseling.com/\" hint-size=\"120px,48px\"><\u002Fx-import>\n      <div style=\"display:flex;align-items:center;gap:1.5em;flex-wrap:wrap\">\n        <a href=\"#roles\" style=\"font-weight:700;font-size:var(--text-body);text-decoration:none\">Open Positions<\u002Fa>\n        <a href=\"#why\" style=\"font-weight:700;font-size:var(--text-body);text-decoration:none\">Why MMHC<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <section id=\"top\" data-screen-label=\"Hero\" style=\"position:relative;display:flex;align-items:center;padding:3rem 24px;background:var(--surface-strong);overflow:hidden\">\n    <div data-sway=\"1\" data-hero-bgleaf=\"1\" style=\"position:absolute;width:420px;height:420px;border-radius:0 100% 0 100%;background:var(--mmhc-overlay-white-4);transform:rotate(-18deg);left:-170px;top:-190px;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;width:100%;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,0.9fr);gap:1rem 3rem;align-items:center\" data-hero-grid=\"1\">\n      <div style=\"max-width:540px;display:flex;flex-direction:column;gap:1.5rem\">\n        <div data-enter=\"up\" style=\"font-size:var(--text-eyebrow);font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-on-dark-eyebrow)\">Careers at MMHC &amp; Authenticity<\u002Fdiv>\n        <h1 data-enter=\"up\" style=\"margin:0;font-family:var(--font-heading);font-weight:700;font-size:var(--text-h1);line-height:var(--leading-h1);letter-spacing:var(--tracking-h1);color:var(--color-on-dark-heading);text-wrap:pretty;animation-delay:90ms\">Do Your Best Work. Help Build Better Care.<\u002Fh1>\n        <p data-enter=\"up\" style=\"margin:0;font-size:var(--text-lead);line-height:var(--leading-body);color:var(--color-on-dark-body);text-wrap:pretty;animation-delay:180ms\">We’re growing a mental healthcare organization for people who want to keep getting better at what they do. Join us in clinical care, operations, technology or product, and help make excellent therapy more accessible.<\u002Fp>\n        <div data-enter=\"up\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:1em;margin-top:1rem;animation-delay:270ms\">\n          <div data-hero-btn=\"1\" style=\"width:240px\"><x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Button\" variant=\"primary\" href=\"#roles\" hint-size=\"240px,48px\">View Open Positions<\u002Fx-import><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div data-hero-decor=\"1\" style=\"position:relative;width:100%;max-width:440px;aspect-ratio:1/1;justify-self:center;margin:0;pointer-events:none\">\n        <div data-ring=\"1\" style=\"position:absolute;inset:-22%;border-radius:50%;border:1px solid var(--mmhc-overlay-white-14);animation-delay:500ms\"><\u002Fdiv>\n        <div data-ring=\"1\" style=\"position:absolute;inset:-9%;border-radius:50%;border:1px solid var(--mmhc-overlay-white-14);animation-delay:350ms\"><\u002Fdiv>\n        <div data-enter=\"pop\" style=\"position:absolute;inset:6%;animation-delay:150ms\">\n          <div data-breathe=\"1\" style=\"width:100%;height:100%;border-radius:50%;background:var(--surface-accent)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-orbit=\"1\" style=\"position:absolute;inset:-9%\">\n          <div style=\"position:absolute;width:7%;aspect-ratio:1/1;left:50%;top:0;translate:-50% -50%;border-radius:50%;background:var(--surface-mint)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-orbit=\"rev\" style=\"position:absolute;inset:-22%\">\n          <div style=\"position:absolute;width:4%;aspect-ratio:1/1;left:14.6%;top:14.6%;translate:-50% -50%;border-radius:50%;background:var(--surface-accent)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-enter=\"pop\" data-hero-leaf=\"1\" style=\"position:absolute;width:26%;aspect-ratio:1/1;right:-4%;bottom:-2%;animation-delay:320ms\">\n          <div data-sway=\"1\" style=\"width:100%;height:100%;border-radius:0 100% 0 100%;background:var(--surface-mint);transform:rotate(18deg)\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div data-enter=\"pop\" data-hero-mark=\"1\" style=\"position:absolute;inset:6%;display:flex;align-items:center;justify-content:center;animation-delay:600ms\">\n          <x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Logo\" variant=\"mark-green\" height=\"{{ 160 }}\" assets-base=\"./assets/logo/\" alt=\"\" hint-size=\"186px,190px\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"roles\" data-screen-label=\"Find your role\" style=\"padding:3rem 24px;background:var(--surface-mint)\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"margin-bottom:1.5rem;text-align:center\">\n        <div style=\"font-size:var(--text-eyebrow);font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-eyebrow)\">Open Positions<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:var(--font-heading);font-weight:700;font-size:var(--text-h2);line-height:var(--leading-h2);color:var(--color-heading)\">Find Your Role.<\u002Fh2>\n        <p style=\"margin:1em auto 0;max-width:40em;font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-label);text-wrap:pretty\">Manhattan Mental Health Counseling provides online therapy across New York. Authenticity supports MMHC with technology and practice operations.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:1em\">\n        <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"2\">\n          <div data-lift=\"1\" style=\"flex:1 1 380px;max-width:570px;display:flex;flex-direction:column;gap:1em;padding:2rem;border-radius:15px;border:1px solid var(--border-default);border-left:3px solid var(--border-accent);background:var(--surface-card)\">\n            <div style=\"font-size:var(--text-eyebrow);font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-eyebrow)\">{{ r.team }}<\u002Fdiv>\n            <h3 data-h=\"sub\" style=\"margin:0;font-family:var(--font-heading);font-weight:700;font-size:1.5rem;line-height:var(--leading-h2);color:var(--color-heading);text-wrap:pretty\"><span style=\"background:{{ r.mark }};border-radius:3px\">{{ r.title }}<\u002Fspan><\u002Fh3>\n            <sc-if value=\"{{ r.hasDetails }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:0.5rem\">\n              <sc-for list=\"{{ r.specs }}\" as=\"s\" hint-placeholder-count=\"3\">\n                <span style=\"padding:0.5rem 0.9rem;border-radius:50px;background:var(--surface-mint);font-size:var(--text-small);font-weight:600;color:var(--color-heading)\">{{ s }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <p style=\"margin:0;flex:1;font-size:var(--text-body);line-height:var(--leading-body);text-wrap:pretty\"><span style=\"background:{{ r.mark }};border-radius:3px\">{{ r.summary }}<\u002Fspan><\u002Fp>\n            <\u002Fsc-if>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Button\" variant=\"primary\" href=\"{{ r.href }}\" hint-size=\"350px,48px\">View Role and Apply<\u002Fx-import>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <p style=\"margin:1.5rem auto 0;max-width:920px;text-align:center;font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-label);text-wrap:pretty\">All roles are fully remote.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"why\" data-screen-label=\"Why here\" style=\"padding:3rem 24px\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"margin-bottom:1.5rem;text-align:center\">\n        <div style=\"font-size:var(--text-eyebrow);font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-eyebrow)\">Why MMHC<\u002Fdiv>\n        <h2 style=\"margin:0;font-family:var(--font-heading);font-weight:700;font-size:var(--text-h2);line-height:var(--leading-h2);color:var(--color-heading)\">Why Build Your Career Here?<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;justify-content:center;gap:1em\">\n        <sc-for list=\"{{ pillars }}\" as=\"p\" hint-placeholder-count=\"3\">\n          <div style=\"flex:1 1 300px;max-width:380px;display:flex;flex-direction:column;gap:1em;padding:2rem;border-radius:15px;border:1px solid var(--border-default);background:var(--surface-card-mint)\">\n            <span style=\"width:34px;height:34px;border-radius:50%;background:var(--badge-number-strong-bg);color:var(--badge-number-strong-fg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:var(--text-body)\">{{ p.num }}<\u002Fspan>\n            <h3 data-h=\"card\" style=\"margin:0;font-family:var(--font-body);font-size:1.1rem;font-weight:700;color:var(--color-heading)\">{{ p.title }}<\u002Fh3>\n            <p style=\"margin:0;font-size:var(--text-body);line-height:var(--leading-body);text-wrap:pretty\">{{ p.body }}<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Ambition\" style=\"position:relative;padding:4rem 24px;background:var(--surface-accent);overflow:hidden\">\n    <div data-breathe=\"1\" style=\"position:absolute;width:520px;height:520px;border-radius:50%;background:var(--mmhc-overlay-white-45);right:-220px;top:-240px;pointer-events:none\"><\u002Fdiv>\n    <div style=\"position:relative;max-width:920px;margin:0 auto;text-align:center;display:flex;flex-direction:column;gap:1em;align-items:center\">\n      <div style=\"font-size:var(--text-eyebrow);font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--color-on-accent-eyebrow)\">Who We Look For<\u002Fdiv>\n      <h2 style=\"margin:0;font-family:var(--font-heading);font-weight:700;font-size:var(--text-h2);line-height:var(--leading-h2);color:var(--color-heading)\">Ambition With Purpose.<\u002Fh2>\n      <p style=\"margin:0;font-size:var(--text-lead);line-height:var(--leading-body);color:var(--color-on-accent-heading);max-width:40em;text-wrap:pretty\">We look for people who want to become excellent at what they do and take on meaningful responsibility. You ask good questions, act on feedback and follow through. As we grow, help us build an organization that gets better with every step.<\u002Fp>\n      <div style=\"margin-top:0.5rem;display:flex;justify-content:center;width:100%\">\n        <x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Button\" variant=\"submit\" href=\"#roles\" hint-size=\"350px,48px\">View Open Positions<\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <x-import component-from-global-scope=\"MMHCDesignSystem_1d8c58.Footer\" assets-base=\"./assets/logo/\" copyright=\"Copyright © 2026 Manhattan Mental Health Counseling LLC\" hint-size=\"100%,320px\"><\u002Fx-import>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst TEAMS = [\n  { id: 'clinical', name: 'Clinical Care', org: 'MMHC' },\n  { id: 'ops', name: 'Operations and People', org: 'Authenticity' },\n  { id: 'tech', name: 'Technology and Product', org: 'Authenticity' }\n];\n\nconst ROLES = [\n  { track: 'clinical', title: 'Licensed Mental Health Counselor (LMHC)', specs: ['Full-time', 'Remote · New York State', 'Active NY LMHC'], summary: 'A full caseload of individual adult clients by online therapy, with weekly peer consultation, AI-supported documentation and a path to clinical supervision.', href: 'https://manhattanmentalhealthcounseling.com/mental-health-counselor-jobs/' },\n  { track: 'clinical', title: 'Mental Health Counselor, Limited Permit (MHC-LP)', specs: ['Full-time', 'Remote · New York State', 'Valid MHC-LP'], summary: 'Grow your skills, confidence and experience with adult clients via telehealth, with direct and peer supervision, monthly workshops and full administrative support.', href: 'https://manhattanmentalhealthcounseling.com/limited-permit-mental-health-counseling-jobs-nyc/' },\n  // Simple roles: just title, team and link. Add a line here to post a new role.\n  { track: 'ops', title: 'People Operations Coordinator', href: '#' },\n  { track: 'ops', title: 'Medical Receptionist', href: '#' },\n  { track: 'tech', title: 'Product Engineer', href: '#' }\n];\n\nconst PILLARS = [\n  { num: '1', title: 'Work on something that matters.', body: 'Help make thoughtful, insurance-covered therapy easier to access. Whether you provide care, improve operations or build technology, your work contributes to that goal.' },\n  { num: '2', title: 'Bring ideas. Take responsibility.', body: 'We’re looking for people who notice what could work better and help improve it. Bring your judgment, take ownership of your work and turn good ideas into practical results.' },\n  { num: '3', title: 'Keep getting better.', body: 'Clinicians develop through supervision, peer consultation and training. Across every team, we value curiosity, thoughtful feedback and the drive to improve your craft.' }\n];\n\nclass Component extends DCLogic {\n  renderVals() {\n    const teamName = Object.fromEntries(TEAMS.map(t => [t.id, `${t.name} · ${t.org}`]));\n    return {\n      roles: ROLES.map(r => ({ ...r, team: teamName[r.track], hasDetails: !!r.summary, specs: r.specs || [], mark: 'transparent' })),\n      pillars: PILLARS\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
